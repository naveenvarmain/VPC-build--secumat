<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Claroty Integration Self-Test</title>
    <style>
        :root {
            --bg: #0f1419;
            --panel: #1a2029;
            --border: #333c4a;
            --text: #e6e6e6;
            --accent: #b18cff;
            --button: #5c2d91;
        }
        body.light {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --border: #d9dee8;
            --text: #1d2433;
            --accent: #5c2d91;
            --button: #5c2d91;
        }
        body { font-family: Consolas, monospace; background: var(--bg); color: var(--text); padding: 24px; }
        .page-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
        h1 { color: var(--accent); font-size: 18px; margin: 0; }
        input { width: 100%; padding: 8px; margin: 6px 0; background: var(--panel); color: var(--text);
                border: 1px solid var(--border); border-radius: 4px; font-family: inherit; }
        button { padding: 10px 18px; background: #5c2d91; color: #fff; border: 0;
                 border-radius: 4px; cursor: pointer; margin: 8px 0; }
        .theme-toggle { margin: 0; border: 1px solid var(--border); background: var(--panel); color: var(--text); white-space: nowrap; }
        .theme-toggle:hover { background: var(--button); color: #fff; }
        pre { background: var(--panel); padding: 14px; border-radius: 4px; white-space: pre-wrap;
              border: 1px solid var(--border); line-height: 1.5; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; }
    </style>
</head>
<body>
    <div class="page-head">
        <h1>Claroty Integration Self-Test (claroty.js)</h1>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme" aria-pressed="false">
            <span id="themeIcon">🌙</span>
            <span id="themeLabel">Dark</span>
        </button>
    </div>
    <input type="text" id="baseUrl" value="https://eu.api.claroty.com">
    <input type="password" id="apiKey" placeholder="Paste Claroty API token">
    <button onclick="runTests()">Run Tests</button>
    <pre id="out">Awaiting run...</pre>

    <script src="claroty.js"></script>
    <script>
        function applyTheme(light) {
            document.body.classList.toggle('light', light);
            const button = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (button) button.setAttribute('aria-pressed', String(light));
            if (icon) icon.textContent = light ? '☀️' : '🌙';
            if (label) label.textContent = light ? 'Light' : 'Dark';
            try { localStorage.setItem('soc-theme', light ? 'light' : 'dark'); } catch (e) { /* ignore */ }
        }

        (function initTheme() {
            let saved = 'dark';
            try { saved = localStorage.getItem('soc-theme') || 'dark'; } catch (e) { /* ignore */ }
            applyTheme(saved === 'light');
            document.getElementById('themeToggle')?.addEventListener('click', () => {
                applyTheme(!document.body.classList.contains('light'));
            });
        })();

        const out = document.getElementById('out');
        const lines = [];
        function log(ok, name, detail) {
            lines.push(`${ok ? '[PASS]' : '[FAIL]'} ${name}${detail ? '\n        ' + detail : ''}`);
            out.innerHTML = lines.map(l =>
                `<span class="${l.startsWith('[PASS]') ? 'pass' : 'fail'}">${l
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`).join('\n');
        }

        async function runTests() {
            lines.length = 0;
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();

            // claroty.js reads its config from this localStorage key
            localStorage.setItem('soc-integrations', JSON.stringify({
                claroty: { baseUrl, apiKey, proxyUrl: 'http://cloudproxy.zf-world.com:8080' }
            }));

            try {
                log(typeof ClarotyAPI === 'object', 'ClarotyAPI module loaded');
                log(ClarotyAPI.canGoLive() === true, 'canGoLive() is true with baseUrl + apiKey');

                const conn = await ClarotyAPI.testConnection();
                log(conn.ok === true, 'testConnection()', JSON.stringify(conn).slice(0, 160));

                const valid = await ClarotyAPI.validateConnection();
                log(valid.ok === true, 'validateConnection()', valid.msg);

                const res = await ClarotyAPI.fetchDeviceVulnerabilityRelations(50, 0);
                const rows = res.data || res;
                log(res.source === 'live', 'fetchDeviceVulnerabilityRelations() returns LIVE data',
                    `source=${res.source}${res.error ? ' error=' + res.error : ''}`);
                log(Array.isArray(rows) && rows.length > 0,
                    'returned a non-empty array', `count=${Array.isArray(rows) ? rows.length : 'n/a'}`);

                const r = rows[0] || {};
                log('device_uid' in r && 'vulnerability_id' in r,
                    'records carry expected schema fields',
                    Object.keys(r).slice(0, 6).join(', '));

                const page2 = await ClarotyAPI.fetchDeviceVulnerabilityRelations(50, 50);
                const rows2 = page2.data || page2;
                log(rows2[0] && rows2[0].vulnerability_id !== r.vulnerability_id,
                    'offset pagination returns a different page');
            } catch (e) {
                log(false, 'Unhandled exception', e.message);
            }
        }
    </script>
</body>
</html>
